<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt - ROVOLT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <img src="ChatGPT%20Image%2030.%207.%202026,%2013_42_51.png" alt="ROVOLT logo" class="logo">
    <div>
      <h1>Kontaktujte ROVOLT</h1>
      <p>Radi vám odpovieme na vaše otázky.</p>
    </div>
  </header>

  <main class="content">
    <section class="section">
      <h2>Napíšte nám</h2>
      <form action="mailto:info@rovolt.sk" method="post" enctype="text/plain" class="contact-form">
        <label for="name">Meno</label>
        <input type="text" id="name" name="Meno" placeholder="Vaše meno" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="Email" placeholder="Váš e-mail" required>

        <label for="message">Správa</label>
        <textarea id="message" name="Správa" placeholder="Vaša správa" rows="6" required></textarea>

        <button type="submit">Odoslať správu</button>
      </form>
    </section>

    <section class="section contact">
      <h2>Kontakt</h2>
      <p>E-mail: <a href="mailto:info@rovolt.sk">info@rovolt.sk</a></p>
      <p>Tel.: +421 904 826 557</p>
      <p>Adresa: Spišská Nová Ves, Slovensko</p>
    </section>
  </main>
</body>
</html>
